name: Build Android APK (Ultra-Optimized)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.10.2 & Build APKs
        shell: bash
        run: |
          set -o pipefail
          GRADLE_VERSION=8.10.2
          if [ ! -d "$HOME/.gradle-dist/gradle-${GRADLE_VERSION}" ]; then
            mkdir -p "$HOME/.gradle-dist"
            curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d "$HOME/.gradle-dist"
          fi
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$HOME/.gradle-dist/gradle-${GRADLE_VERSION}/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          yes | sdkmanager --licenses || true
          
          echo "Starting assembleDebug..."
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build_debug.log || {
            echo "=== GRADLE ASSEMBLE DEBUG FAILED ==="
            tail -n 100 build_debug.log
            exit 1
          }
          
          echo "Starting assembleRelease..."
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build_release.log || true

      - name: Upload Build Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics-Log
          path: build_*.log
          if-no-files-found: ignore

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProAnimationStudio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Ready-to-Install Release APK (R8 Optimized)
        uses: actions/upload-artifact@v4
        with:
          name: ProAnimationStudio-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
